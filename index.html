<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Chills</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f2f2;
    }

    .app {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .status {
      font-size: 12px;
      color: #9ca3af;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 80px;
      color: #666;
    }

    .welcome h2 {
      color: #111827;
      margin-bottom: 10px;
    }

    .message-box {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    .message-box input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
    }

    .message-box button {
      width: 50px;
      border: none;
      border-radius: 50%;
      background: #111827;
      color: white;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div>
        <h1>🔥 Hot Chills</h1>
        <div class="status">Chat with friends</div>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome">
        <h2>Welcome to Hot Chills</h2>
        <p>Start a conversation below 💬</p>
      </div>
    </div>

    <div class="message-box">
      <input id="messageInput" type="text" placeholder="Type a message...">
      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      if (input.value.trim() === "") return;

      const message = document.createElement("p");
      message.textContent = input.value;
      message.style.background = "#111827";
      message.style.color = "white";
      message.style.padding = "10px 14px";
      message.style.borderRadius = "18px";
      message.style.marginBottom = "10px";
      message.style.marginLeft = "auto";
      message.style.maxWidth = "75%";

      chat.appendChild(message);
      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
